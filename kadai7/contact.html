<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>お問い合わせ | 私について</title>
        <meta name="description" content="お問い合わせページ">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="img/twitter.png">
        <link rel="apple-touch-icon" href="img/twitter.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/contact.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="js/main.js"></script>
        <meta property="og:title" content="私について">
        <meta property="og:description" content="自己紹介サイト">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://example.com/">
        <meta property="og:image" content="img/ogp.png">
    </head>

    <body>
        <!-- ヘッダー -->
        <header class="header">
            <div class="header-inner">
                <h1 class="logo">
                    <a href="index.html">私について</a>
                </h1>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="profile.html">プロフィール</a></li>
                        <li><a href="personal.html">パーソナル</a></li>
                        <li><a href="portfolio.html">ポートフォリオ</a></li>
                        <li><a href="contact.html">お問い合わせ</a></li>
                    </ul>
                </nav>
                <button class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        

        <main>
            <!-- お問い合わせフォーム -->
            <section class="contact-section">
                <h2>お問い合わせ</h2>

                <form action="index.html" method="get" class="contact-form">

                    <div class="form-group">
                        <label for="name">名前</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="名前を入力してください"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="メールアドレスを入力してください"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="message">内容</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="8"
                            placeholder="内容を入力してください"
                            required></textarea>
                    </div>

                    <div class="submit-area">
                        <button type="submit">
                            送信
                        </button>
                    </div>

                </form>
            </section>
        </main>

        <!-- フッター -->
        <footer class="footer">
            <nav class="footer-nav">
                <ul>
                    <li><a href="profile.html">プロフィール</a></li>
                    <li><a href="personal.html">パーソナル</a></li>
                    <li><a href="portfolio.html">ポートフォリオ</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
            <p class="copyright">
                &copy; 私について
            </p>
        </footer>
    </body>
</html>
